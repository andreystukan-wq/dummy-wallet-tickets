<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Dummy Wallet Tickets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #f1f3f7;
    --surface: #ffffff;
    --ink: #101a2b;
    --ink-2: #576274;
    --line: #dce1ea;
    --accent: #24508f;
    --accent-ink: #ffffff;
    --chip: #e6ebf3;
    --focus: #2f6fd0;
    --shadow: 0 1px 2px rgba(16, 26, 43, 0.06), 0 6px 20px rgba(16, 26, 43, 0.06);
    --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
    --body: "Public Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d121a;
      --surface: #151c27;
      --ink: #e7ebf2;
      --ink-2: #9aa5b6;
      --line: #263142;
      --accent: #86aef0;
      --accent-ink: #0d121a;
      --chip: #1f2836;
      --focus: #86aef0;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d121a;
    --surface: #151c27;
    --ink: #e7ebf2;
    --ink-2: #9aa5b6;
    --line: #263142;
    --accent: #86aef0;
    --accent-ink: #0d121a;
    --chip: #1f2836;
    --focus: #86aef0;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    font-size: 15px;
    line-height: 1.5;
    padding-inline: 16px;
    padding-block: 28px 56px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  button, input, select { font: inherit; }
  button { cursor: pointer; }

  /* ---------- Index ---------- */
  .top h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(30px, 5vw, 40px);
    line-height: 1.05;
    letter-spacing: 0.01em;
    margin: 0 0 6px;
    text-wrap: balance;
  }
  .top p { margin: 0; color: var(--ink-2); max-width: 66ch; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
    border-radius: 8px; padding: 6px 12px; font-size: 13.5px; font-weight: 500;
    text-decoration: none; white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-2); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }

  .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.grow { flex: 1 1 260px; }
  .field > span { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--ink-2); }
  .field input, .field select {
    height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink);
    padding: 0 10px; font-size: 14px; max-width: 100%;
  }
  .field select { padding-right: 28px; }

  .list-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  .count { color: var(--ink-2); font-size: 14px; font-variant-numeric: tabular-nums; }
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
  .trow { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .trow:last-child { border-bottom: 0; }
  .qr-mini { width: 44px; height: 44px; background: #fff; border-radius: 4px; padding: 3px; border: 1px solid var(--line); display: block; }
  .l1 { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .l1 a {
    font-family: var(--display); font-weight: 600; font-size: 18px; line-height: 1.15; color: var(--ink);
    text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .l1 a:hover { color: var(--accent); }
  .l2 { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
  .l2 b { color: var(--ink); font-weight: 500; }
  .acts { display: flex; gap: 8px; }
  .empty { padding: 28px 16px; text-align: center; color: var(--ink-2); }
  .tag {
    display: inline-block; flex: none; font-family: var(--mono); font-size: 11px; font-weight: 500;
    background: var(--chip); color: var(--ink-2); border-radius: 999px; padding: 1px 8px;
  }
  .note { font-size: 13px; color: var(--ink-2); margin: 0; }
  .link-text {
    font-family: var(--mono); font-size: 12px; color: var(--ink-2); background: var(--chip);
    border-radius: 6px; padding: 6px 8px; word-break: break-all; user-select: all;
  }
  .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  #clip { position: absolute; left: -9999px; top: 0; width: 1px; height: 1px; }

  @media (max-width: 620px) {
    .trow { grid-template-columns: 44px minmax(0, 1fr); }
    .acts { grid-column: 1 / -1; }
    .acts .btn { flex: 1; }
  }

  /* ---------- Ticket view ---------- */
  .ticket-view { max-width: 400px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 16px; }
  .crumbs { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; }
  .crumbs a { text-decoration: none; font-weight: 500; }
  .pager { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
  .pager a, .pager span.off {
    width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); text-decoration: none; color: var(--ink);
  }
  .pager span.off { opacity: 0.4; }

  /* The pass follows the mobile wallet layout: mark + small fields across the top, one large
     field over the artwork, two rows of label/value pairs, the barcode on a white plate at the foot. */
  .pass {
    --pass-bg: #12233f; --pass-accent: #e2b13c;
    background: var(--pass-bg); color: #fff; border-radius: 18px; overflow: hidden;
    box-shadow: 0 2px 4px rgba(11, 18, 32, 0.18), 0 18px 40px rgba(11, 18, 32, 0.22);
    font-family: -apple-system, "SF Pro Text", var(--body);
  }
  .pass-top { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; }
  .mark {
    width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center;
    background: var(--pass-accent); color: var(--pass-bg);
    font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: 0.03em;
  }
  .org { flex: 1; min-width: 0; font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head-fields { display: flex; gap: 14px; text-align: right; }
  .lbl { font-size: 9.5px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: rgba(255, 255, 255, 0.7); }
  .val { font-size: 14px; font-weight: 500; line-height: 1.2; margin-top: 1px; }
  .art { position: relative; height: 128px; display: flex; align-items: flex-end; padding: 12px 16px; }
  .art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 30%, rgba(0, 0, 0, 0.45)); }
  .art.pitch {
    background:
      radial-gradient(circle at 50% 120%, transparent 46px, rgba(255, 255, 255, 0.22) 47px, rgba(255, 255, 255, 0.22) 49px, transparent 50px),
      repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.07) 0 34px, transparent 34px 68px),
      linear-gradient(160deg, #2f7d4a, #1d5a34);
  }
  .art.lights {
    background:
      radial-gradient(ellipse 40% 90% at 20% -10%, rgba(255, 210, 160, 0.55), transparent 70%),
      radial-gradient(ellipse 35% 80% at 55% -20%, rgba(255, 140, 190, 0.45), transparent 70%),
      radial-gradient(ellipse 40% 90% at 88% -10%, rgba(150, 190, 255, 0.5), transparent 70%),
      linear-gradient(180deg, #2a1240, #120819);
  }
  .art.lounge {
    background:
      repeating-linear-gradient(135deg, rgba(226, 177, 60, 0.12) 0 2px, transparent 2px 14px),
      linear-gradient(160deg, #2b2f36, #15171b);
  }
  .art.away {
    background:
      repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.06) 0 30px, transparent 30px 60px),
      linear-gradient(160deg, #6b2230, #3d1219);
  }
  .primary { position: relative; z-index: 1; }
  .primary .val {
    font-family: var(--display); font-weight: 700; font-size: 27px; line-height: 1.02;
    letter-spacing: 0.01em; text-wrap: balance;
  }
  .row { display: flex; gap: 14px; padding: 12px 16px 0; }
  .row > div { flex: 1; min-width: 0; }
  .row .val { overflow-wrap: anywhere; }
  .row.big .val { font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .plate {
    margin: 16px; background: #fff; color: #0b1220; border-radius: 12px; padding: 16px 16px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .plate canvas { display: block; }
  .plate .cap { font-family: var(--mono); font-size: 13px; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
  .plate .void {
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: #a3262f; border: 1px solid currentColor; border-radius: 4px; padding: 2px 6px;
  }
  .qr-missing { width: 184px; height: 184px; display: grid; place-items: center; text-align: center; font-size: 12px; color: #576274; border: 1px dashed #c4cad6; border-radius: 8px; padding: 12px; }

  .wallet { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .wallet button {
    background: #000; color: #fff; border: 1px solid #000; border-radius: 10px; padding: 9px 10px;
    font-size: 13px; font-weight: 600; line-height: 1.2; text-align: left; display: flex; align-items: center; gap: 8px;
  }
  .wallet button small { display: block; font-size: 10px; font-weight: 500; opacity: 0.75; }
  .wallet svg { flex: none; }
  :root[data-theme="dark"] .wallet button { border-color: #3a4556; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wallet button { border-color: #3a4556; } }
  .wallet-msg { font-size: 13px; color: var(--ink-2); min-height: 1.2em; margin-top: -6px; }

  .details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px; }
  .details dl { margin: 0; }
  .details .d { display: grid; grid-template-columns: 112px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .details .d:last-child { border-bottom: 0; }
  .details dt { color: var(--ink-2); }
  .details dd { margin: 0; overflow-wrap: anywhere; }
  .details dd.mono { font-family: var(--mono); font-size: 13px; }
  .share { display: flex; flex-direction: column; gap: 8px; }

  @media (prefers-reduced-motion: no-preference) {
    .pass { animation: rise 0.28s ease-out; }
    @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
  }
</style>
</head>

    const canvas = document.createElement("canvas");

    return canvas;

  const miniCache = new Map();
  function miniQR(value) {
    if (typeof QRious === "undefined") return "";
    if (!miniCache.has(value)) miniCache.set(value, makeQR(value, 88).toDataURL());
    return miniCache.get(value);
  }
  function drawQR(host, value, cssSize) {
    if (typeof QRious === "undefined") {
      host.innerHTML = `<div class="qr-missing">QR code library didn't load. Barcode ${esc(groupDigits(value))}</div>`;
      return;
    }
    const ratio = Math.max(1, Math.round(window.devicePixelRatio || 1));
    const canvas = makeQR(value, cssSize * ratio);
    canvas.style.width = canvas.style.height = cssSize + "px";
    canvas.setAttribute("role", "img");
    canvas.setAttribute("aria-label", "QR code for barcode " + groupDigits(value));
    host.replaceChildren(canvas);

  async function copy(text, btn) {
    const label = btn.textContent;
    try {

      clip.value = text;
      clip.focus();
      clip.select();
      btn.textContent = "Selected, press ⌘C";

        <div>
          <div class="l1"><a href="#${t.id}">${esc(t.fixture)}</a><span class="tag">${esc(t.id)}</span></div>
          <div class="l2"><b>${esc(holderOf(t))}</b> · ${esc(t.priceClass)} · ${esc(placeOf(t))} · ${esc(t.when)}</div>
        </div>
        <div class="acts">
          <button class="btn" type="button" data-copy="${t.id}">Copy link</button>
          <a class="btn" href="#${t.id}">Open</a>
        </div>
      </article>`).join("");
  }

  function renderIndex() {
    document.title = "Dummy Wallet Tickets";
    app.innerHTML = `
      <header class="top">
        <h1>Dummy wallet tickets</h1>
        <p>${ALL.length} sample tickets for prototypes and demos: the new set of ${BATCH2.length} (TKT-0001 to TKT-${String(BATCH2.length).padStart(4, "0")}) and the first 8. Each link opens one ticket as a wallet-style pass with its QR code. Every club, fan, order and barcode is made up, so none of these will scan at a real turnstile.</p>
      </header>
      <div class="filters">
        <label class="field grow"><span>Search</span><input id="q" type="search" placeholder="Name, ticket ID, order or barcode" value="${esc(state.q)}"></label>
        <label class="field"><span>Event</span>
          <select id="f-event">
            <option value="">All events</option>
            ${EVENTS.map((e) => `<option value="${esc(e)}"${state.event === e ? " selected" : ""}>${esc(e)}</option>`).join("")}
          </select>
        </label>
        <label class="field"><span>Set</span>
          <select id="f-set">
            <option value="new"${state.set === "new" ? " selected" : ""}>New set (${BATCH2.length})</option>
            <option value="first"${state.set === "first" ? " selected" : ""}>First set (${FIRST_SET.length})</option>
            <option value=""${state.set === "" ? " selected" : ""}>Both sets (${ALL.length})</option>
          </select>
        </label>
      </div>
      <div class="list-head">
        <span class="count" id="count" aria-live="polite"></span>
        <button class="btn primary" id="copy-shown" type="button">Copy links shown</button>
      </div>
      <section class="list" id="list" aria-label="Tickets"></section>
      <p class="note">The QR on each ticket encodes its 16-digit dummy barcode,. Tickets bought together share an order and page through on the ticket screen. The Apple and Google Wallet buttons are visual only; there is no pass file behind them.</p>
    `;
    renderList();
    document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value; renderList(); });
    document.getElementById("f-event").addEventListener("change", (e) => { state.event = e.target.value; renderList(); });
    document.getElementById("f-set").addEventListener("change", (e) => { state.set = e.target.value; renderList(); });
    document.getElementById("copy-shown").addEventListener("click", (e) => {
      const text = filtered().map((t) => `${t.id}\t${holderOf(t)}\t${t.fixture}\t${linkFor(t)}`).join("\n");
      copy(text, e.currentTarget);
    });
    document.getElementById("list").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-copy]");
      if (btn) copy(linkFor(BY_ID.get(btn.dataset.copy.toLowerCase())), btn);
    });
  }

  const walletIcon = `<svg width="20" height="16" viewBox="0 0 20 16" aria-hidden="true"><rect x="0.5" y="0.5" width="19" height="15" rx="3" fill="none" stroke="#fff"/><rect x="2.5" y="3" width="15" height="2.4" rx="1" fill="#ff9f43"/><rect x="2.5" y="6.2" width="15" height="2.4" rx="1" fill="#2ecc71"/><rect x="2.5" y="9.4" width="15" height="2.4" rx="1" fill="#4aa3ff"/></svg>`;

  function renderTicket(t) {
    const o = ORGS[t.org];
    const siblings = ALL.filter((x) => x.order === t.order);
    const i = siblings.indexOf(t);
    const prev = siblings[i - 1];
    const next = siblings[i + 1];
    document.title = `${t.id} · ${t.fixture}`;
    app.innerHTML = `
      <div class="ticket-view">
        <nav class="crumbs" aria-label="Ticket navigation">
          <a href="#all">← All tickets</a>
          ${siblings.length > 1 ? `
            <div class="pager">
              ${prev ? `<a href="#${prev.id}" aria-label="Previous ticket in this order">‹</a>` : `<span class="off" aria-hidden="true">‹</span>`}
              <span>Ticket ${i + 1} of ${siblings.length}</span>
              ${next ? `<a href="#${next.id}" aria-label="Next ticket in this order">›</a>` : `<span class="off" aria-hidden="true">›</span>`}
            </div>` : `<span class="tag">${esc(t.id)}</span>`}
        </nav>

        <article class="pass" style="--pass-bg:${o.bg};--pass-accent:${o.accent}" aria-label="Ticket ${esc(t.id)}">
          <div class="pass-top">
            <div class="mark">${o.mark}</div>
            <div class="org">${esc(o.name)}</div>
            <div class="head-fields">
              <div><div class="lbl">Date</div><div class="val">${esc(t.date)}</div></div>
              <div><div class="lbl">${t.org === "live" ? "Doors" : t.date === "Season" ? "Season" : "Kick-off"}</div><div class="val">${esc(t.time)}</div></div>
            </div>
          </div>
          <div class="art ${t.art}">
            <div class="primary">
              <div class="lbl">${esc(t.competition)}</div>
              <div class="val">${esc(t.fixture)}</div>
            </div>
          </div>
          <div class="row big">
            ${t.big.map(([k, v]) => `<div><div class="lbl">${esc(k)}</div><div class="val">${esc(v)}</div></div>`).join("")}
          </div>
          <div class="row">
            ${t.aux.map(([k, v]) => `<div><div class="lbl">${esc(k)}</div><div class="val">${esc(v)}</div></div>`).join("")}
          </div>
          <div class="plate">
            <div id="qr"></div>
            <div class="cap">${esc(groupDigits(t.barcode))}</div>
            <div class="void">Sample · not valid for entry</div>
          </div>
        </article>

        <div class="wallet">
          <button type="button" data-wallet="Apple Wallet">${walletIcon}<span><small>Add to</small>Apple Wallet</span></button>
          <button type="button" data-wallet="Google Wallet">${walletIcon}<span><small>Add to</small>Google Wallet</span></button>
        </div>
        <div class="wallet-msg" id="wallet-msg" aria-live="polite"></div>

        <section class="details" aria-label="Ticket details">
          <dl>
            <div class="d"><dt>Ticket ID</dt><dd class="mono">${esc(t.id)}</dd></div>
            <div class="d"><dt>Event</dt><dd>${esc(t.fixture)}</dd></div>
            <div class="d"><dt>When</dt><dd>${esc(t.when)}</dd></div>
            <div class="d"><dt>Venue</dt><dd>${esc(t.venue)}</dd></div>
            <div class="d"><dt>Ticket</dt><dd>${esc(t.priceClass)} · ${esc(t.price)}</dd></div>
            <div class="d"><dt>Order</dt><dd class="mono">${esc(t.order)}</dd></div>
            <div class="d"><dt>Barcode</dt><dd class="mono">${esc(t.barcode)}</dd></div>
            <div class="d"><dt>Admits</dt><dd>${esc(t.description)}</dd></div>
            <div class="d"><dt>Terms</dt><dd>${esc(TERMS)}</dd></div>
          </dl>
        </section>

        <section class="share" aria-label="Link to this ticket">
          <div class="link-text">${esc(linkFor(t))}</div>
          <div class="card-actions"><button class="btn" type="button" id="copy-this">Copy link</button></div>
        </section>
      </div>
    `;
    drawQR(document.getElementById("qr"), t.barcode, 184);
    const msg = document.getElementById("wallet-msg");
    app.querySelectorAll("[data-wallet]").forEach((b) =>
      b.addEventListener("click", () => (msg.textContent = `Demo button. No ${b.dataset.wallet} pass is attached to this sample ticket.`)),
    );
    document.getElementById("copy-this").addEventListener("click", (e) => copy(linkFor(t), e.currentTarget));
  }

  function route() {
    const t = BY_ID.get(decodeURIComponent(location.hash.slice(1)).toLowerCase());
    if (state.view === "index") state.scroll = window.scrollY;
    if (t) {
      state.view = "ticket";
      renderTicket(t);
      window.scrollTo(0, 0);
    } else {
      state.view = "index";
      renderIndex();
      window.scrollTo(0, state.scroll);
    }
  }

  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
